name: Debug Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for Gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Prepare APK for upload
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/devbrowser-debug.apk

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: devbrowser-debug
          path: dist/devbrowser-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish debug download
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug
          name: Debug Build
          prerelease: true
          body: |
            Debug APK signed with the committed debug keystore.
            Package name: `com.unixshells.devbrowser.debug`
          files: dist/devbrowser-debug.apk
